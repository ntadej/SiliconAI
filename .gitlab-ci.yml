# GitLab Continuous Integration configuration for the repository.

stages:
  - lint
  - test

# Run pre-commit hooks
pre-commit:
  stage: lint
  image: python:3.11
  script:
    - export PATH=/root/.local/bin:$PATH
    - pip install pipx
    - pipx install pre-commit
    - pre-commit run --all-files

