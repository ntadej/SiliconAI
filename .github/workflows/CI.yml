name: Continuous Integration
on: [push]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [3.12, 3.13]

    env:
      UV_PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python venv
        run: |
          uv sync -p $UV_PYTHON_VERSION --extra cpu

      - name: Run tests
        shell: bash
        run: |
          uv run -p $UV_PYTHON_VERSION pytest -W error

      - name: Report coverage with Codecov
        if: github.event_name == 'push' && matrix.python-version == 3.13
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }} && matrix.python-version == 3.13
        uses: codecov/test-results-action@v1
