name: Continuous Integration
on: [push]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python venv
        run: |
          uv sync -p 3.13

      - name: Run tests
        shell: bash
        run: |
          uv run -p 3.13 pytest -W error

