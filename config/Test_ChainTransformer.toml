name = "Test Chain Transformer"

[data]
type = "ActsChain"
input_dim = 10762
split_ratio = [0.8, 0.1, 0.1]
batch_size = 2
workers = 12

[data.conversion]
input = "ACTS_Muon_100GeV_Barrel_hits_test.h5"
output = "ACTS_Muon_100GeV_Barrel_hits_test_chain.pkl"
columns_integer = ["geometry_id", "particle_type", "lxq", "lyq"]

[model]
type = "ChainTransformer"
sequence_length = 100
model_dim = 16            # 512
encoder_layers = 3        # 6
heads = 2                 # 8
feedforward_dim = 64      # 2048
activation = "gelu"
dropout = 0.1

[training]
epochs = 5
early_stopping = 0

optimizer = "Adam"
learning_rate = 0.0001
weight_decay = 0.0
