name = "ACTS Transformer Muon 100 GeV Barrel"

[data]
type = "ActsHits"
input_file = "ACTS_Muon_100GeV_Barrel_hits.h5"
input_dim = [2667, 3]
split_ratio = [0.1, 0.05, 0.85]
batch_size = 1024
workers = 12

[model]
type = "Transformer"
model_dim = 64         # 512
encoder_layers = 3     # 6
decoder_layers = 0     # 6
heads = 2              # 8
feedforward_dim = 512  # 2048
activation = "ReLU"
dropout = 0.1
loss = "cross_entropy"

[training]
epochs = 50
early_stopping = 3

optimizer = "Adam"
learning_rate = 0.001
weight_decay = 0.0
