name = "ACTS Transformer Muon 100 GeV Barrel"

[data]
type = "ActsHits"
input_dim = [3762, 3, 6773, 7589]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 4000
workers = 12

[data.conversion]
input = "ACTS_Muon_100GeV_Barrel_hits.h5"
output = "ACTS_Muon_100GeV_Barrel_hits.pkl"

[model]
type = "Transformer"
model_dim = 128        # 512
encoder_layers = 3     # 6
decoder_layers = 0     # 6
heads = 4              # 8
feedforward_dim = 512  # 2048
activation = "ReLU"
dropout = 0.1
loss = "cross_entropy"

[training]
epochs = 500
early_stopping = 3

optimizer = "Adam"
learning_rate = 0.001
weight_decay = 0.0
