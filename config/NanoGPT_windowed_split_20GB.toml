name = "NanoGPT Windowed Split 20GB"

[data]
type = "ActsChain"
input_dim = [21, 2220, 2, 188]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 4096
workers = 12
padding_token = 999999
end_token = 1000001

[data.conversion]
input = "ACTS_muon_70-90GeV.h5"
output = "ACTS_muon_70-90GeV_windowed_split.h5"
columns = ["geometry_id", "particle_type", "lxq", "lyq", "tpxq", "tpyq", "tpzq"]
columns_type = [
    "categorical", # for index
    "categorical",
    "categorical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
]
split_numerical = true
index_with_offset = 100000
max_blocks = 4
block_size = 13

[model]
type = "NanoGPT"
sequence_length = 56
model_dim = 128
encoder_layers = 8
heads = 8
dropout = 0.2
activation = "gelu"

[training]
compile = true

epochs = 2000
checkpoint_interval = 200
early_stopping = 0

optimizer = "AdamW"
learning_rate = 4e-3
beta2 = 0.95
weight_decay = 0.01
gradient_clipping = 5.0

[training.scheduler]
type = "NanoGPTScheduler"
interval = "step"
min_lr = 4e-4
warmup_steps = 1425
freeze_step = 900000
