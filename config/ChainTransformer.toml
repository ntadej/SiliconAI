name = "Chain Transformer"

[data]
type = "ActsChain"
input_dim = [3619, 154]
split_ratio = [0.5, 0.25, 0.25]
padding_token = 9999
end_token = 10001
batch_size = 1400
workers = 12

[data.conversion]
input = "ACTS_Muon_100GeV_Barrel_hits.h5"
output = "ACTS_Muon_100GeV_Barrel_hits_chain.pkl"
columns_integer = ["geometry_id", "lxq", "lyq"]
columns_type = ["categorical", "numerical", "numerical"]

[model]
type = "ChainTransformer"
sequence_length = 128
model_dim = 128           # 512
encoder_layers = 8        # 6
heads = 8                 # 8
feedforward_dim = 512     # 2048
activation = "gelu"
dropout = 0.1

[training]
epochs = 2000
early_stopping = 0

optimizer = "Adam"
learning_rate = 0.0001
weight_decay = 0.0
