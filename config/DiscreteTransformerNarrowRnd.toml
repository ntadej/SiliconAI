name = "Discrete Transformer Narrow Random"

[data]
type = "ActsHits"
input_dim = [3811, 3, 6774, 7577]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 2048
workers = 12
padding_token = 9999
end_token = 10001
random_int = 1024

[data.conversion]
input = "ACTS_Muon_100GeV_Barrel_Narrow_hits.h5"
output = "ACTS_Muon_100GeV_Barrel_Narrow_hits_discrete_rnd.pkl"
columns_integer = ["geometry_id", "particle_type", "lxq", "lyq"]

[model]
type = "DiscreteTransformer"
sequence_length = 35
model_dim = 128              # 512
encoder_layers = 3           # 6
heads = 4                    # 8
feedforward_dim = 512        # 2048
activation = "gelu"
dropout = 0.1

[training]
compile = true

epochs = 2000
early_stopping = 0

optimizer = "Adam"
learning_rate = 0.001
weight_decay = 0.0

[training.scheduler]
type = "CosineAnnealingWarmRestarts"
interval = "step"
T_0 = 40
