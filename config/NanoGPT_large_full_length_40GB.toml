name = "NanoGPT Large FullLength 40GB"

[data]
type = "ActsChain"
input_dim = [2220, 2, 12308]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 512
workers = 12
padding_token = 999999
end_token = 1000001

[data.conversion]
input = "ACTS_muon_70-90GeV.h5"
output = "ACTS_muon_70-90GeV_full_length.h5"
columns = ["geometry_id", "particle_type", "lxq", "lyq", "tpxq", "tpyq", "tpzq"]
columns_type = [
    "categorical",
    "categorical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
]

[model]
type = "NanoGPT"
sequence_length = 256
model_dim = 256
encoder_layers = 8
heads = 8
dropout = 0.2
activation = "gelu"

[training]
compile = true

epochs = 2000
checkpoint_interval = 50
early_stopping = 0

optimizer = "AdamW"
learning_rate = 1e-3
beta2 = 0.95
weight_decay = 0.01
gradient_clipping = 5.0

[training.scheduler]
type = "NanoGPTScheduler"
interval = "step"
min_lr = 1e-4
warmup_steps = 1000
freeze_step = 1500000
