name = "ACTS Test Transformer Muon 100 GeV Barrel"

[data]
type = "ActsHits"
input_dim = [2667, 3]
split_ratio = [0.8, 0.1, 0.1]
batch_size = 16
workers = 12

[data.conversion]
input = "ACTS_Muon_100GeV_Barrel_hits_test.h5"
output = "ACTS_Muon_100GeV_Barrel_hits_test.pkl"

[model]
type = "Transformer"
model_dim = 16         # 512
encoder_layers = 3     # 6
decoder_layers = 0     # 6
heads = 2              # 8
feedforward_dim = 64   # 2048
activation = "ReLU"
dropout = 0.1
loss = "cross_entropy"

[training]
epochs = 5
early_stopping = 3

optimizer = "Adam"
learning_rate = 0.001
weight_decay = 0.0
