name = "Test NanoGPT FullLengthSplit"

[data]
type = "ActsChain"
input_dim = [50, 154]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 1024
workers = 12
padding_token = 999999
end_token = 1000001

[data.conversion]
input = "ACTS_muon_80-85GeV_mini.h5"
output = "ACTS_muon_80-85GeV_mini_test_full_length_split.pkl"
columns = ["geometry_id", "lxq", "lyq", "tpxq", "tpyq", "tpzq"]
columns_type = [
    "categorical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
]
split_numerical = true

[model]
type = "NanoGPT"
sequence_length = 256
model_dim = 128
encoder_layers = 8
heads = 8
dropout = 0.2

[training]
compile = true

epochs = 100
checkpoint_interval = 5
early_stopping = 0

optimizer = "AdamW"
learning_rate = 1e-3
beta2 = 0.95
weight_decay = 0.01
gradient_clipping = 5.0

[training.scheduler]
type = "NanoGPTScheduler"
interval = "step"
min_lr = 1e-4
warmup_steps = 200
freeze_step = 8000
