name = "Test NanoGPT"

[data]
type = "ActsChain"
input_dim = [20, 50, 7949]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 3072
workers = 12
padding_token = 999999
end_token = 1000001

[data.conversion]
input = "ACTS_muon_80-85GeV_mini.h5"
output = "ACTS_muon_80-85GeV_mini_test_chain.pkl"
columns = ["geometry_id", "lxq", "lyq", "tpxq", "tpyq", "tpzq"]
columns_type = [
    "categorical", # for index
    "categorical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
]
index_with_offset = 100000
max_blocks = 5
block_size = 7

[model]
type = "NanoGPT"
sequence_length = 40
model_dim = 128
encoder_layers = 8
heads = 8
dropout = 0.2

[training]
compile = true

epochs = 200
checkpoint_interval = 5
early_stopping = 5

optimizer = "Adam"
learning_rate = 0.0001
weight_decay = 0.01
gradient_clipping = 5.0
