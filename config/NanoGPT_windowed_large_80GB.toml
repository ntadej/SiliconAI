name = "NanoGPT Windowed Large 80GB"

[data]
type = "ActsChain"
input_dim = [21, 2220, 2, 12308]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 4048
workers = 12
padding_token = 999999
end_token = 1000001

[data.conversion]
input = "ACTS_muon_70-90GeV.h5"
output = "ACTS_muon_70-90GeV_windowed.h5"
columns = ["geometry_id", "particle_type", "lxq", "lyq", "tpxq", "tpyq", "tpzq"]
columns_type = [
    "categorical", # for index
    "categorical",
    "categorical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
]
index_with_offset = 100000
max_blocks = 4
block_size = 8

[model]
type = "NanoGPT"
sequence_length = 40
model_dim = 512
encoder_layers = 8
heads = 8
dropout = 0.2
activation = "gelu"

[training]
compile = true

epochs = 10000
checkpoint_top_k = 10
early_stopping = 0

optimizer = "AdamW"
learning_rate = 2e-3
beta2 = 0.95
weight_decay = 0.01
gradient_clipping = 5.0

[training.scheduler]
type = "NanoGPTScheduler"
interval = "step"
min_lr = 2e-4
warmup_steps = 1200
freeze_step = 1200000

[inference]
batch_size = 16384
simple_mask = false
