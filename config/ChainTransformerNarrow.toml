name = "Chain Transformer Narrow"

[data]
type = "ActsChain"
input_dim = [3642, 154]
split_ratio = [0.5, 0.25, 0.25]
padding_token = 9999
end_token = 10001
batch_size = 1536
workers = 12

[data.conversion]
input = "ACTS_Muon_100GeV_Barrel_Narrow_hits.h5"
output = "ACTS_Muon_100GeV_Barrel_Narrow_hits_chain.pkl"
columns_integer = ["geometry_id", "lxq", "lyq"]
columns_type = ["categorical", "numerical", "numerical"]

[model]
type = "ChainTransformer"
sequence_length = 192
model_dim = 128           # 512
encoder_layers = 4        # 6
heads = 4                 # 8
feedforward_dim = 512     # 2048
activation = "gelu"
dropout = 0.1

[training]
compile = true

epochs = 2000
early_stopping = 0

optimizer = "Adam"
learning_rate = 0.0003
weight_decay = 0.0

[training.scheduler]
type = "CosineAnnealingWarmRestarts"
interval = "step"
T_0 = 40
