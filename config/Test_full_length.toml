name = "Test Full Length"

[data]
multiple_files = true
input_dim = [50, 11230]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 500
epoch_size = 200000
workers = 4
padding_token = 999999
end_token = 1000001

[data.conversion]
input = "Muon_pt80-85_eta005-010_phi000-010"
output_suffix = "full"
columns = ["geometry_id", "lxq", "lyq", "tpxq", "tpyq", "tpzq"]
columns_type = [
    "categorical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
]

[data.files]
nfiles = 10
events_per_file = 100000

[model]
type = "NanoGPT"
sequence_length = 128
model_dim = 128
layers = 8
heads = 8
dropout = 0.2

[training]
epochs = 10
checkpoint_interval = 1
early_stopping = 0

optimizer = "AdamW"
learning_rate = 1e-3
beta2 = 0.95
weight_decay = 0.01
gradient_clipping = 5.0

[training.scheduler]
type = "NanoGPTScheduler"
interval = "step"
min_lr = 1e-4
warmup_steps = 200
freeze_step = 8000
