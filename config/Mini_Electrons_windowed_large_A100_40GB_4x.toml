name = "Mini Electrons Windowed Large"

[data]
multiple_files = true
input_dim = [86, 2772, 13083]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 2500
epoch_size = 1000000
workers = 4
padding_token = 999999
end_token = 1000001

[data.conversion]
input = "Electron_pt80-85_eta005-010_phi000-010"
output_suffix = "chain"
columns = ["geometry_id", "lxq", "lyq", "tpxq", "tpyq", "tpzq"]
columns_type = [
    "categorical", # for index
    "categorical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
]
index_with_offset = 100000
max_blocks = 5
block_size = 7

[data.files]
nfiles = 10
events_per_file = 100000

[model]
type = "NanoGPT"
sequence_length = 40
model_dim = 256
layers = 8
heads = 8
dropout = 0.2

[training]
epochs = 2500
checkpoint_top_k = 10
early_stopping = 0

optimizer = "AdamW"
learning_rate = 4e-3
beta2 = 0.95
weight_decay = 0.01
gradient_clipping = 5.0

[training.scheduler]
type = "NanoGPTScheduler"
interval = "step"
min_lr = 4e-4
warmup_steps = 300
freeze_step = 100000
