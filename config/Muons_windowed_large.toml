name = "Muons Windowed Large 40GB"

[data]
multiple_files = true
input_dim = [21, 2222, 2, 16879]
split_ratio = [0.5, 0.25, 0.25]
batch_size = 4000
epoch_size = 800000
workers = 4
padding_token = 999999
end_token = 1000001

[data.conversion]
input = "Muon_pt70-90_eta005-025"
output_suffix = "chain"
columns = ["geometry_id", "particle_type", "lxq", "lyq", "tpxq", "tpyq", "tpzq"]
columns_type = [
    "categorical", # for index
    "categorical",
    "categorical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
    "numerical",
]
index_with_offset = 100000
max_blocks = 4
block_size = 8

[data.files]
nfiles = 100
events_per_file = 1000000

[model]
type = "NanoGPT"
sequence_length = 40
model_dim = 512
layers = 8
heads = 8
dropout = 0.2

[training]
epochs = 10000
checkpoint_top_k = 25
early_stopping = 0

optimizer = "AdamW"
learning_rate = 2e-3
beta2 = 0.95
weight_decay = 0.01
gradient_clipping = 5.0

[training.scheduler]
type = "NanoGPTScheduler"
interval = "step"
min_lr = 2e-4
warmup_steps = 1000
freeze_step = 500000
